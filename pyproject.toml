[project]
name = "postgresql-loader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nmkhoi3010", email = "nmkhoi@ux-vn.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
